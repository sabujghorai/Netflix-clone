
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Netflix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="grain"></div>

    <a href="index.html" class="logo auth-logo">NETFLIX<span>.</span></a>

    <div class="auth-bg"></div>

    <main class="auth-container">
        <form class="auth-box" id="signinForm">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Sign in.</h1>
            <p class="auth-subtitle">Your next story awaits.</p>

            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button class="auth-submit" type="submit">Sign In ↗</button>

            <div class="auth-divider">OR</div>

            <button class="auth-secondary" type="button" id="guestBtn">Continue as Guest</button>

            <p class="auth-bottom">
                New to Netflix? <a href="get_started.html">Join now.</a>
            </p>

            <p class="auth-legal">
                This is a student frontend concept. No credentials are stored.
            </p>
        </form>
    </main>

    <script>
        document.getElementById("signinForm").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Demo only — backend authentication is not connected yet.");
        });

        document.getElementById("guestBtn").addEventListener("click", function() {
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
