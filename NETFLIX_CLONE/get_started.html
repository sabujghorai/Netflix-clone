
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Netflix — Begin Your Journey</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="grain"></div>

    <a href="index.html" class="logo auth-logo">NETFLIX<span>.</span></a>

    <div class="auth-bg"></div>

    <main class="auth-container">
        <form class="auth-box" id="signupForm">
            <p class="eyebrow">UNLIMITED ENTERTAINMENT</p>
            <h1>Join the<br><span class="red-text">experience.</span></h1>
            <p class="auth-subtitle">Create your account and explore another universe.</p>

            <label for="name">Full name</label>
            <input type="text" id="name" placeholder="Your name" required>

            <label for="signupEmail">Email address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com" required>

            <label for="signupPassword">Create password</label>
            <input type="password" id="signupPassword" placeholder="At least 8 characters" minlength="8" required>

            <button class="auth-submit" type="submit">Create Account ↗</button>

            <p class="auth-bottom">
                Already a member? <a href="signin.html">Sign in.</a>
            </p>

            <p class="auth-legal">
                This is a frontend concept. Account creation is not connected to a server.
            </p>
        </form>
    </main>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(e) {
            e.preventDefault();
            alert("Welcome! This is a frontend demo. Signup backend is not connected.");
        });
    </script>

</body>
</html>
