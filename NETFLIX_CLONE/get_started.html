
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Netflix</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" defer></script>
    <script src="js/script.js" defer></script>
</head>

<body data-page="start">

    <header class="nav" id="nav">
        <div class="nav-left">
            <a class="logo" href="index.html">NETFLIX</a>
        </div>

        <div class="nav-right">
            <a href="signin.html" class="btn btn-red">Sign In</a>
        </div>
    </header>

    <div class="hero-bg">
        <div class="poster-wall" data-wall></div>
        <div class="spot"></div>
    </div>

    <main class="auth-page">
        <section class="auth-card wide">

            <div id="step-label" class="step-label">
                STEP 1 OF 2
            </div>

            <div id="progress" class="progress">
                <i></i>
            </div>

            <div id="banner" class="banner hidden" aria-live="polite"></div>

            <!-- STEP 1 -->
            <form id="step1" novalidate>

                <h1 class="step-title">Create your account</h1>

                <p class="step-note">
                    Start your movie and series journey.
                </p>

                <div class="field" id="f-email">
                    <input
                        type="email"
                        id="su-email"
                        placeholder=" "
                        autocomplete="email"
                    >
                    <label for="su-email">Email address</label>
                    <div class="err"></div>
                </div>

                <div class="field has-toggle" id="f-pass">
                    <input
                        type="password"
                        id="su-pass"
                        placeholder=" "
                        autocomplete="new-password"
                    >
                    <label for="su-pass">Create password</label>
                    <button type="button" class="toggle-pw">Show</button>
                    <div class="err"></div>
                </div>

                <button type="submit" class="btn btn-red btn-lg">
                    Continue
                </button>

                <p class="switch-line">
                    Already have an account?
                    <a href="signin.html">Sign In</a>
                </p>

            </form>

            <!-- STEP 2 -->
            <form id="step2" class="hidden">

                <h2 class="step-title">Choose your plan</h2>

                <p class="step-note">
                    You can change your plan at any time.
                </p>

                <div class="plans">

                    <label class="plan">
                        <input type="radio" name="plan" value="Mobile">
                        <div class="plan-box">
                            <div>
                                <b>Mobile</b>
                                <small>480p · Phone & tablet</small>
                            </div>
                            <strong>₹149/mo</strong>
                        </div>
                    </label>

                    <label class="plan">
                        <input type="radio" name="plan" value="Basic">
                        <div class="plan-box">
                            <div>
                                <b>Basic</b>
                                <small>720p · 1 screen</small>
                            </div>
                            <strong>₹199/mo</strong>
                        </div>
                    </label>

                    <label class="plan">
                        <input type="radio" name="plan" value="Standard" checked>
                        <div class="plan-box">
                            <div>
                                <b>Standard</b>
                                <small>1080p · 2 screens</small>
                            </div>
                            <strong>₹499/mo</strong>
                        </div>
                    </label>

                    <label class="plan">
                        <input type="radio" name="plan" value="Premium">
                        <div class="plan-box">
                            <div>
                                <b>Premium</b>
                                <small>4K + HDR · 4 screens</small>
                            </div>
                            <strong>₹649/mo</strong>
                        </div>
                    </label>

                </div>

                <button type="submit" class="btn btn-red btn-lg">
                    Create Account
                </button>

                <p class="switch-line">
                    <a href="#" id="back-link">← Back</a>
                </p>

            </form>

            <p class="hint">
                Demo project only. No real subscription or payment is processed.
            </p>

        </section>
    </main>

</body>
</html>
